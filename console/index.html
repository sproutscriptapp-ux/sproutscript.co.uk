<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Redirecting to the dashboard…</title>
  <script>
    // sproutscript.co.uk/console → the live admin dashboard hosted on Firebase.
    // Any deep-link hash (e.g. /console/#/p/sproutscript/users) is carried across.
    var target = 'https://darkworlds-console.web.app/' + (location.hash || '');
    location.replace(target);
  </script>
  <meta http-equiv="refresh" content="0; url=https://darkworlds-console.web.app/" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0B1120; color: #E2E8F0;
           display: grid; place-items: center; height: 100vh; margin: 0; text-align: center; }
    a { color: #7C5CFC; }
  </style>
</head>
<body>
  <div>
    <p>Taking you to the dashboard…</p>
    <p><a href="https://darkworlds-console.web.app/">Continue manually</a> if you're not redirected.</p>
  </div>
</body>
</html>
